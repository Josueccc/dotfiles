# wallust — wallpaper-driven colorscheme generator
# https://codeberg.org/explosion-mental/wallust
#
# Run manually:        wallust run <image>
# Auto-runs via:       wallust/apply-theme.sh  (waypaper post_command hook)

backend     = "resized"      # fast, good quality
color_space = "labmixed"     # best perceptual mixing
palette     = "dark16"       # dark scheme, 16 colors extracted from the wallpaper
check_contrast = true        # keep foreground/background readable
threshold   = 12

# Template files live in ./templates (this same directory).
# Targets land inside ~/.config/* — most of those dirs are symlinks into this
# repo, so the generated files are listed in .gitignore. Do NOT commit them.
[templates]
hyprland  = { template = "colors-hyprland.lua",   target = "~/.config/hypr/generated-colors.lua" }
waybar    = { template = "colors-waybar.css",     target = "~/.config/waybar/generated-colors.css" }
rofi      = { template = "colors-rofi.rasi",      target = "~/.config/rofi/generated-colors.rasi" }
swaync    = { template = "colors-swaync.css",     target = "~/.config/swaync/generated-colors.css" }
kitty     = { template = "colors-kitty.conf",     target = "~/.config/kitty/generated-colors.conf" }
alacritty = { template = "colors-alacritty.toml", target = "~/.config/alacritty/generated-colors.toml" }
# Firefox cannot use ~/.config/<tool>/ like the rest: its profile directory is
# named with a random hash, so the target is the repo copy and
# firefox/link-profile.sh symlinks it into <profile>/chrome/ alongside
# userChrome.css, which is what actually @imports it.
firefox   = { template = "colors-firefox.css",   target = "~/.dotfiles/firefox/generated-colors.css" }
# tmux's target dir is not in the repo (it owns ~/.tmux.conf, which is), so the
# generated files live outside the repo and need no .gitignore entry. apply-
# theme.sh creates the directory, because wallust does not.
#
# Two files, not one, because tmux freezes its palette at server start: the
# colourN block is startup-only, while the styles carry literal hex and can be
# re-sourced live. Merging them makes every wallpaper change log a source-file
# error. See the comments inside the templates.
tmux      = { template = "colors-tmux.conf",        target = "~/.config/tmux/generated-colors.conf" }
tmuxstyle = { template = "colors-tmux-styles.conf", target = "~/.config/tmux/generated-styles.conf" }
# quickshell (roadmap 3.1) is the one consumer that does NOT need a restart on a
# wallpaper change: shell.qml reads this with a FileView + JsonAdapter and
# watchChanges, so apply-theme.sh has no reload line for it. That is also why
# the template is strict JSON with no comments — JsonAdapter parses it as JSON,
# and unlike CSS or TOML there is no comment syntax that survives that. The
# palette names and source indices are identical to colors-waybar.css on
# purpose, so the bar and the dashboard overlay cannot drift apart.
quickshell = { template = "colors-quickshell.json", target = "~/.config/quickshell/generated-colors.json" }
