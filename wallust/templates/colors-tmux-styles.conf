# Generated by wallust — do not edit (overwritten on wallpaper change).
#
# The LIVE half of the tmux theme: re-sourced by wallust/apply-theme.sh on every
# wallpaper change, so the status line, pane borders and prompts recolour in a
# running tmux. Sourced at start too, so a fresh server is correct.
#
# Every colour here is a literal #RRGGBB, never a palette name, and that is the
# whole point. tmux resolves a palette index ("colour4") at DRAW time, but the
# palette itself is frozen at server start and cannot be re-set at runtime — so
# a name-based style re-sourced live would faithfully repaint the OLD accent. A
# hex literal is resolved when the option is set and stored as RGB, so it
# follows the wallpaper.
#
# Consequence worth knowing: keep this list to options that are actually
# settable at runtime. Sourcing a server-start-only or session-scoped option
# here makes every wallpaper change log a source-file error. Verify with
# `tmux source-file ~/.config/tmux/generated-styles.conf; echo $?` — it must be 0.
#
# wallust's {{colorN}} already carries the leading "#": write fg={{color4}}, not
# fg=#{{color4}}. The doubled hash is not a valid colour, tmux rejects that one
# option, and the style silently keeps whatever it had.

set -g status-style "bg={{color0}},fg={{color7}}"
set -g status-left  "#[fg={{color4}},bold] #S #[default]"
set -g status-right "#{?window_zoomed_flag,#[fg={{color1}}] 󰟅 ,}\
#{?pane_in_mode,#[fg={{color3}}] 󰅐 ,}\
#{?pane_dead,#[fg={{color1}}] 󰅚 ,}\
#{?client_prefix,#[fg={{color4}}] 󰃤 ,}\
#[fg={{color8}}]#H"

# Active window is a filled powerline pill (U+F0344); inactive ones are flat.
# #F keeps the activity/bell dot.
setw -g window-status-format          " #I:#W#F "
setw -g window-status-current-format "#[fg={{color4}}]󰐄#[fg={{color0}}]#[bg={{color4}}] #I:#W#F #[fg={{color4}}]#[bg={{color0}}]󰐄#[default]"
set -g window-status-separator       "#[fg={{color0}}]󰐄"

set -g pane-border-style        "fg={{color8}}"
set -g pane-active-border-style "fg={{color4}}"

# Prompts, mode and copy-mode use the accent too, so tmux reads as part of the
# desktop instead of a green default bar.
set -g message-style         "fg={{color0}},bg={{color3}},bold"
set -g message-command-style "fg={{color0}},bg={{color4}},bold"
set -g mode-style            "fg={{color0}},bg={{color3}},bold"
