# Generated by wallust — do not edit (overwritten on wallpaper change).
#
# The LIVE half of the tmux theme: re-sourced by wallust/apply-theme.sh on every
# wallpaper change, so the status line, pane borders and prompts recolour in a
# running tmux. Sourced at start too, so a fresh server is correct.
#
# Every colour here is a literal #RRGGBB, never a palette name, and that is the
# whole point. tmux resolves a palette index ("colour4") at draw time, but the
# palette itself is frozen at server start and cannot be re-set at runtime — so
# a name-based style re-sourced live would faithfully repaint the OLD accent. A
# hex literal is resolved when the option is set and stored as RGB, so it
# follows the wallpaper.
#
# Keep this list to options that are actually settable at runtime. Verify with
# `tmux source-file ~/.config/tmux/generated-styles.conf; echo $?` — it must be 0.
#
# wallust's {{colorN}} already carries the leading "#": write fg={{color4}}, not
# fg=#{{color4}}. The doubled hash is not a valid colour, tmux rejects that one
# option, and the style silently keeps whatever it had.
#
# ── About the glyphs ────────────────────────────────────────────────────────
# Every icon below is written as a codepoint, never as a literal character, and
# the codepoint is spelled out in the comment beside it. That is not fussiness:
# typing these private-use characters by hand produced seven WRONG codepoints
# (U+F0120 came out as U+F0112, U+F002 as U+F0349, and so on), which is how
# copy-mode ended up showing a clock. There is no reliable way to type U+F0xx.
#
# They are also plane-15 private use (U+F0000..), not the BMP range
# (U+E000..U+F8FF) — a script that only checks the BMP range reports "no
# glyphs found" in a file that is full of them.
#
# Each one was picked by looking at a rendered sheet of candidates, not by
# reading its name: the obvious picks were wrong. U+F0150 "copy-mode" is
# literally a clock face, U+F00E4 is a beetle, U+F0084 is a person, and
# U+F055 reads as a power button.
#
#   U+F0120  terminal (>_ prompt)   -> session name
#   U+F065E  maximise               -> zoomed pane
#   U+F002   magnifier              -> copy-mode / search
#   U+F0F3   bell                   -> bell in the active window
#   U+F015A  circle-x               -> dead pane
#   U+F023   padlock                -> prefix key held
#   U+F108   computer               -> hostname
#   U+2502   vertical bar           -> separator between windows
#   U+25CF   filled circle          -> window activity

set -g status-style "bg={{color0}},fg={{color7}}"

# ── Left: session name ──────────────────────────────────────────────────────
# One cell wide, sits on the baseline, cannot collide with the text beside it.
set -g status-left "#[fg={{color4}}] 󰄠 #[fg={{color4}},bold]#S#[default] "

# ── Window list ─────────────────────────────────────────────────────────────
# A plain vertical bar between windows, and a filled pill for the active one.
# Deliberately NOT a powerline separator. The Nerd Font powerline glyphs
# (U+F0404, U+F0344) are drawn as thin half-cell connectors meant to abut the
# next cell, but a monospace font gives every glyph the same advance width, so
# they render as a crossed-out scribble floating in dead space. That was the
# "icons look overlapped and unreadable" bug; a plain bar has no such
# constraint and cannot overlap anything.
#
# `#F` is deliberately absent: it is what emitted the glued `-` and `*` marks
# right after the window name. The activity and bell markers below are explicit
# conditionals, so each gets its own colour and its own space.
set -g window-status-separator "#[fg={{color8}}]│#[default]"
setw -g window-status-format " #[fg={{color7}}]#I:#W#{?window_activity_flag,#[fg=#E06C5A] ●,}#{?window_bell_flag,#[fg=#E06C5A] ,}#[default] "
setw -g window-status-current-format " #[bg={{color4}}]#[fg={{color0}}] #I:#W #[default]"

# ── Right: state indicators, then the host ──────────────────────────────────
# These use FIXED colours, not wallpaper ones, and that is a deliberate
# exception. Drawn from the palette, the "warning" came out #618435 against an
# accent of #808832 — two olives a few percent apart, so the indicators read as
# noise instead of as state. A warning that does not look like a warning is
# worse than one that does not match the wallpaper.
set -g status-right "#{?window_zoomed_flag,#[fg=#E06C5A] 󰙞 ,}\
#{?pane_in_mode,#[fg=#98C379]  ,}\
#{?window_bell_flag,#[fg=#E06C5A]  ,}\
#{?pane_dead,#[fg=#E06C5A] 󰅚 ,}\
#{?client_prefix,#[fg={{color4}}]  ,}\
#[fg={{color8}}] #H"

# ── Panes and prompts ───────────────────────────────────────────────────────
set -g pane-border-style        "fg={{color8}}"
set -g pane-active-border-style "fg={{color4}}"

# Activity and bell marks would otherwise inherit the name's colour; give them
# the accent so a window with news is visible without reading every name.
set -g window-status-activity-style "fg={{color4}},bold"
set -g window-status-bell-style     "fg=#E06C5A,bold"

set -g message-style         "fg={{color0}},bg=#E06C5A,bold"
set -g message-command-style "fg={{color0}},bg={{color4}},bold"
set -g mode-style            "fg={{color0}},bg=#98C379,bold"
