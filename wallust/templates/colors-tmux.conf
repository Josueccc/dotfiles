# Generated by wallust — do not edit (overwritten on wallpaper change).
# Sourced ONCE, by ~/.tmux.conf, at tmux server start.
#
# This file holds only what CANNOT change in a running server, so that the
# companion generated-styles.conf can be re-sourced on every wallpaper change
# without erroring. The split is not cosmetic:
#
#   * colourN and default-colour are fixed when the server starts. `set -g
#     colour4` is valid in a config file and fails at runtime with
#     "invalid option" — verified on tmux 3.7c.
#   * mode-keys-style and copy-mode-style are session-scoped, so `set -g` on
#     them is rejected the same way when sourced without a target session.
#
# Sourcing this file at runtime still applies everything valid in it and
# returns non-zero because of those lines, which is why apply-theme.sh
# re-sources ONLY generated-styles.conf.

set -g default-terminal "tmux-256color"

# Feature flags, appended (-a) so tmux's built-in entries survive. Without
# these, programs inside tmux advertise 256 colours and silently drop italics
# and underline — the "colours are wrong inside tmux" bug.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",xterm-256color:clipboard"
set -as terminal-features ",xterm*:focus"

# Fallback for any colour name tmux cannot resolve.
set -g default-colour "{{foreground}}"

# ── The 16 ANSI slots ───────────────────────────────────────────────────────
# What panes advertise to nvim / lazygit / git, so `colorN` output inside tmux
# is the wallpaper's palette rather than tmux's built-in table. Same values as
# generated-colors.conf for kitty and alacritty.
#
# One option per line: tmux's set takes at most one name/value pair, and a
# second pair on the same line raises "too many arguments (need at most 2)"
# and aborts the rest of the config file — which is how a whole tmux config
# silently fell back to tmux's defaults once.
set -g colour0  "{{color0}}"
set -g colour1  "{{color1}}"
set -g colour2  "{{color2}}"
set -g colour3  "{{color3}}"
set -g colour4  "{{color4}}"
set -g colour5  "{{color5}}"
set -g colour6  "{{color6}}"
set -g colour7  "{{color7}}"
set -g colour8  "{{color8}}"
set -g colour9  "{{color9}}"
set -g colour10 "{{color10}}"
set -g colour11 "{{color11}}"
set -g colour12 "{{color12}}"
set -g colour13 "{{color13}}"
set -g colour14 "{{color14}}"
set -g colour15 "{{color15}}"
