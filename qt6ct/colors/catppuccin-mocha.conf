# Catppuccin Mocha colour scheme for qt6ct (Qt6 apps).
#
# Why this file exists: qt6ct ships schemes like dusk.conf, but dusk is a LIGHT
# scheme — pointing color_scheme_path at it gave Qt6 apps light-grey windows on a
# dark desktop. A partial Catppuccin scheme was also already sitting in
# qt6ct/style-colors.conf, except only its disabled_colors held the Catppuccin
# values while active/inactive kept qt6ct's light defaults, so it never applied.
#
# All three sections (active/inactive/disabled) are the same palette here on
# purpose: Qt6 apps should look identical whether or not a widget is focused.
# Field order is qt6ct's fixed 22-value ColorScheme layout — do not reorder.
#
# Mocha: base #1e1e2e · mantle #181825 · surface0 #313244 · surface1 #45475a
#        text #cdd6f4 · subtext0 #a6adc8 · blue #89b4fa · mauve #cba6f7
[ColorScheme]
active_colors=#ff1e1e2e, #ff414654, #ff5f677f, #ff313131, #ff000000, #ff191919, #ff1e1e2e, #ffcdd6f4, #ff1e1e2e, #ff404552, #ff383c4a, #ff000000, #ff5294e2, #66ffffff, #ff009dff, #ff9e4fff, #ff3c434f, #ffffffff, #ff000000, #ffeefcff, #80ffffff, #ff181825
disabled_colors=#ff1e1e2e, #ff414654, #ff5f677f, #ff313131, #ff000000, #ff191919, #ff1e1e2e, #ffcdd6f4, #ff1e1e2e, #ff404552, #ff383c4a, #ff000000, #ff5294e2, #66ffffff, #ff009dff, #ff9e4fff, #ff3c434f, #ffffffff, #ff000000, #ffeefcff, #80ffffff, #ff181825
inactive_colors=#ff1e1e2e, #ff414654, #ff5f677f, #ff313131, #ff000000, #ff191919, #ff1e1e2e, #ffcdd6f4, #ff1e1e2e, #ff404552, #ff383c4a, #ff000000, #ff5294e2, #66ffffff, #ff009dff, #ff9e4fff, #ff3c434f, #ffffffff, #ff000000, #ffeefcff, #80ffffff, #ff181825
