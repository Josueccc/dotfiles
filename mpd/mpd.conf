# mpd — the music server rmpc talks to (rmpc is only a client).
# Runs as a systemd *user* service: systemctl --user enable --now mpd
# mpd-mpris (also a user service) bridges it to MPRIS, so playerctl, the media
# keys and the quickshell dashboard's media card see it like any other player.

music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"

# Two listeners, both local-only. The unix socket is what rmpc uses, and it is
# not optional: mpd only lets a client add a file by absolute path (file://…)
# when it is connected over a local socket — TCP from 127.0.0.1 does not count.
# rmpc's YouTube playback (`:addyt`, `searchyt`) downloads into its cache_dir
# and adds the file exactly that way. TCP stays for mpd-mpris and other clients.
bind_to_address     "~/.local/state/mpd/socket"
bind_to_address     "127.0.0.1"
port                "6600"

auto_update         "yes"
restore_paused      "yes"

# PipeWire native. cava (rmpc's visualizer pane) captures the sink's monitor,
# so no fifo output is needed.
audio_output {
    type    "pipewire"
    name    "PipeWire"
}
