# hyprsunset — time-based colour temperature (night light).
#
# hyprsunset applies the profile whose time is the most recent one at startup,
# then swaps to the next profile when the clock hits it — no timer, no
# exec-once time gating. Started from hyprland.lua's autostart block.
#
# Manual override (sticks until the next profile swap):
#   Super + SHIFT + M      →  hyprland/scripts/nightlight.sh
#   hyprctl hyprsunset reset

# Allows gamma to be pushed past 100% — useful to compensate for the dimming
# that the night profiles apply on a dim panel.
max-gamma = 150

# Base: no colour shift at all, so a session that starts before the evening
# profiles keep a neutral white screen.
profile {
    time = 00:00
    identity = true
    gamma = 1.0
}

# Sunset: first, gentle warm shift.
profile {
    time = 18:45
    temperature = 5000
    gamma = 0.95
}

# Night: full warm shift, dimmed a touch.
profile {
    time = 22:30
    temperature = 3500
    gamma = 0.85
}
