# hyprlock — blurred screenshot of your desktop as the background.
# Colors stay Catppuccin (hyprlock can't include files, so no wallust here).
# Verify with `hyprlock` (or Super+Ctrl+L) after editing.

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05, 0
    animation = fadeIn, 1, 6, wind
    animation = fadeOut, 1, 4, wind
    animation = inputFieldDots, 1, 2, wind
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75      # the "dim level" — whole screen sits in the dark
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# Lock glyph, echoing the input pill it sits above
label {
    monitor =
    text = 󰈳
    color = rgba(137b4faee)
    font_size = 26
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(11111bcc)
    position = 0, 320
    halign = center
    valign = center
}

# Big clock with soft drop shadow
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cdd6f4ff)
    font_size = 110
    font_family = JetBrainsMono Nerd Font Bold
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(11111bcc)
    shadow_boost = 1.2
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(cdd6f4bb)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(11111baa)
    position = 0, 110
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = 󰀄  $USER
    color = rgba(cdd6f4aa)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# Pill-shaped password field
input-field {
    monitor =
    size = 320, 52
    rounding = 26
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgb(89b4fa)
    inner_color = rgba(1e1e2ecc)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    placeholder_text = <i> Password...</i>
    hide_input = false
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgb(fab387)
    position = 0, -120
    halign = center
    valign = center
}

# Hints
label {
    monitor =
    text = <i> Super+Shift+M  night light        Esc  clear field</i>
    color = rgba(166adc880)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -220
    halign = center
    valign = center
}
