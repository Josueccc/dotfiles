theme {
    # Catppuccin Mocha — the dark variant, matching the rest of the desktop
    # (bar, rofi, terminals all fall back to Mocha). This was pointing at
    # catppuccin-latte-*, which is the LIGHT scheme, so every Qt6 app
    # (breeze-settings6, ark, dolphin…) rendered as a white window on a dark
    # desktop. If you ever want wallpaper-driven Qt instead of a static scheme,
    # see the matugen note in CLAUDE.md.
    color_scheme = /usr/share/color-schemes/catppuccin-mocha-blue.conf
    icon_theme   = Papirus
    style        = Fusion
    font         = Noto Sans
    font_size    = 10
    font_fixed   = JetBrainsMono Nerd Font
    font_fixed_size = 10
}

misc {
    single_click_activate         = true
    menus_have_icons              = true
    shortcuts_for_context_menus   = true
}

bogus_key_for_test = 1
