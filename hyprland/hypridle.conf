general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 5 min: dim the panel. A real screen-off would be jarring this early, and
# brightnessctl -r on resume restores whatever it was, so nothing is lost.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 15 min: lock. Was 6 min, which is hostile during a long compile or a
# full-screen video that doesn't register as a D-Bus inhibit.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 25 min: blank the outputs. This is the "screen off" step, distinct from the
# panel dim above — dpms off drops the display's power state entirely.
listener {
    timeout = 1500
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 45 min: suspend. Last, so a long build never gets the machine suspended
# out from under it while the screen is still on.
listener {
    timeout = 2700
    on-timeout = systemctl suspend
}
