general {
    # Roadmap 3.3: the idle lock is the quickshell lock screen, same script the
    # Super+Ctrl+L bind uses, so idle and manual locking cannot diverge.
    #
    # The `pidof hyprlock ||` guard that used to be here is gone with hyprlock as
    # the primary. lock.sh already refuses to start a second lock process, and
    # the idle path firing while a manual lock is already up is now harmless
    # rather than something the guard existed to prevent.
    lock_cmd = $HOME/.config/hypr/scripts/lock.sh
    # resume-trace.sh copies Hyprland's tmpfs log into the journal around the
    # suspend: a resume that ends in a hard reset otherwise erases the only log
    # that says why. Read it with `journalctl -b -1 -t resume-trace`.
    before_sleep_cmd = $HOME/.config/hypr/scripts/resume-trace.sh pre; loginctl lock-session
    after_sleep_cmd = $HOME/.config/hypr/scripts/resume-trace.sh post; $HOME/.config/hypr/scripts/wake-monitors.sh; $HOME/.config/hypr/scripts/dim-ramp.sh wake
    ignore_dbus_inhibit = false

    # Hold the suspend until ext-session-lock reports the session locked.
    # Without it, `loginctl lock-session` returns at once and the machine can
    # reach S3 before the quickshell lock exists — the lock is then built
    # during resume, racing the NVIDIA output coming back. Bounded by logind's
    # InhibitDelayMaxSec (5s), so a lock that never engages cannot block
    # suspend. Disables on_lock_cmd/on_unlock_cmd, which this file does not use.
    inhibit_sleep = 3
}

# 5 min: fade the panel down to 10% over 45s. A real screen-off would be jarring
# this early, and `wake` puts the old level back, so nothing is lost.
# This is a script and not a bare `brightnessctl -s set 10` for two reasons, both
# found by running them: `set 10` is a raw value (10 of this panel's 65535, so
# black, not 10%), and a single set is a visible jump rather than a fade. hypridle
# runs the command through /bin/sh -c, so $HOME and `;` both work here.
#
# IF 10% IS TOO DARK TO READ THE PASSWORD / LOCK SCREEN IN DAYLIGHT: the floor is
# the default in hyprland/scripts/dim-ramp.sh (`ramp "${1:-45}" "${2:-10}"`), not
# here, because this line passes no arguments. Either raise that default or pass
# the values explicitly, e.g. `dim-ramp.sh dim 45 20`. Unverified either way: 10%
# is the number the config always intended, and judging it needs someone actually
# standing in front of the screen in real light.
listener {
    timeout = 300
    on-timeout = $HOME/.config/hypr/scripts/dim-ramp.sh dim
    on-resume = $HOME/.config/hypr/scripts/dim-ramp.sh wake
}

# 15 min: lock. Was 6 min, which is hostile during a long compile or a
# full-screen video that doesn't register as a D-Bus inhibit.
# The lock lands on an already-faded panel, so no second ramp is needed here —
# and adding one would widen the window in which a user who came back still
# gets locked.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 25 min: blank the outputs. This is the "screen off" step, distinct from the
# panel fade above — dpms off drops the display's power state entirely.
# NOT `hyprctl dispatch dpms off`: this Hyprland's hyprctl is the Lua build, where
# `dispatch` takes a Lua expression, so that form dies with "')' expected near
# 'off'" and the screen never blanks. The eval form below is the working one.
#
# The argument is a TABLE. hl.dsp.dpms('off') ignores the string and TOGGLES every
# output, so it blanked the screens only because they happened to be on — and the
# same toggle in the wake path turned a lit screen off. { action = 'off' } is off.
#
# The hl.dispatch(...) wrapper is NOT optional. hl.dsp.dpms(...) on its own only
# *builds* a dispatcher object; hl.dispatch() is what runs it. The bare form
# returns "ok" and blanks nothing — and a dispatcher name that does not exist at
# all also returns "ok", so "ok" is never evidence. Prove a change with
# `hyprctl monitors | grep dpmsStatus` (1 = on, 0 = off).
#
# on-resume points at wake-monitors.sh rather than repeating the eval one-liner.
# Idle-resume and sleep-resume are separate events with the same job, and this is
# the one that matters: the bare command was leaving both screens black after a
# suspend, because it can race the DRM re-arm on the way out of S3 and because it
# trusts a $HYPRLAND_INSTANCE_SIGNATURE that a restarted compositor leaves stale.
# The script issues the same dispatch, but settles first and then checks
# dpmsStatus rather than assuming it worked. It no-ops immediately when the
# outputs are already on, so the common idle-resume costs nothing.
listener {
    timeout = 1500
    on-timeout = hyprctl eval "hl.dispatch(hl.dsp.dpms({ action = 'off' }))"
    on-resume = $HOME/.config/hypr/scripts/wake-monitors.sh
}

# 45 min: suspend. Last, so a long build never gets the machine suspended
# out from under it while the screen is still on.
listener {
    timeout = 2700
    on-timeout = systemctl suspend
}
