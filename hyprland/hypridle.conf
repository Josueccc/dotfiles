general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval "hl.dispatch(hl.dsp.dpms('on'))"; $HOME/.config/hypr/scripts/dim-ramp.sh wake
    ignore_dbus_inhibit = false
}

# 5 min: fade the panel down to 10% over 45s. A real screen-off would be jarring
# this early, and `wake` puts the old level back, so nothing is lost.
# This is a script and not a bare `brightnessctl -s set 10` for two reasons, both
# found by running them: `set 10` is a raw value (10 of this panel's 65535, so
# black, not 10%), and a single set is a visible jump rather than a fade. hypridle
# runs the command through /bin/sh -c, so $HOME and `;` both work here.
#
# IF 10% IS TOO DARK TO READ THE PASSWORD / LOCK SCREEN IN DAYLIGHT: the floor is
# the default in hyprland/scripts/dim-ramp.sh (`ramp "${1:-45}" "${2:-10}"`), not
# here, because this line passes no arguments. Either raise that default or pass
# the values explicitly, e.g. `dim-ramp.sh dim 45 20`. Unverified either way: 10%
# is the number the config always intended, and judging it needs someone actually
# standing in front of the screen in real light.
listener {
    timeout = 300
    on-timeout = $HOME/.config/hypr/scripts/dim-ramp.sh dim
    on-resume = $HOME/.config/hypr/scripts/dim-ramp.sh wake
}

# 15 min: lock. Was 6 min, which is hostile during a long compile or a
# full-screen video that doesn't register as a D-Bus inhibit.
# The lock lands on an already-faded panel, so no second ramp is needed here —
# and adding one would widen the window in which a user who came back still
# gets locked.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 25 min: blank the outputs. This is the "screen off" step, distinct from the
# panel fade above — dpms off drops the display's power state entirely.
# NOT `hyprctl dispatch dpms off`: this Hyprland's hyprctl is the Lua build, where
# `dispatch` takes a Lua expression, so that form dies with "')' expected near
# 'off'" and the screen never blanks. The eval form below is the working one.
#
# The hl.dispatch(...) wrapper is NOT optional. hl.dsp.dpms('off') on its own only
# *builds* a dispatcher object; hl.dispatch() is what runs it. The bare form
# returns "ok" and blanks nothing — and a dispatcher name that does not exist at
# all also returns "ok", so "ok" is never evidence. Prove a change with
# `hyprctl monitors | grep dpmsStatus` (1 = on, 0 = off).
listener {
    timeout = 1500
    on-timeout = hyprctl eval "hl.dispatch(hl.dsp.dpms('off'))"
    on-resume = hyprctl eval "hl.dispatch(hl.dsp.dpms('on'))"
}

# 45 min: suspend. Last, so a long build never gets the machine suspended
# out from under it while the screen is still on.
listener {
    timeout = 2700
    on-timeout = systemctl suspend
}
