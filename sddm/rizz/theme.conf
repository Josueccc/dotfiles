# Static fallback (Catppuccin Mocha) — used until the first wallpaper change,
# and on any machine where /var/lib/rizz-sddm does not exist.
#
# The live values come from theme.conf.user next to this file, which SDDM reads
# AFTER this one. install-sddm-theme.sh makes it a symlink into
# /var/lib/rizz-sddm/, the one directory the user owns, and
# wallust/apply-theme.sh rewrites it on every wallpaper change.
#
# Values are quoted: SDDM reads this with QSettings, and an unquoted value
# starting with '#' is one parser decision away from being a comment.
[General]
background=""
blurMax="64"
base="#1e1e2e"
mantle="#181825"
crust="#11111b"
surface1="#45475a"
overlay0="#6c7086"
subtext0="#a6adc8"
text="#cdd6f4"
blue="#89b4fa"
