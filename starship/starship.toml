add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold blue"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "

[python]
symbol = " "

[rust]
symbol = " "

[nodejs]
symbol = " "

[golang]
symbol = " "
