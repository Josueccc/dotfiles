# alacritty — https://alacritty.org/config-alacritty.html
#
# Kept in step with kitty/kitty.conf on purpose: kitty is the terminal bound to
# Super+Return, but alacritty is still installed, and a statusline that looks
# right in one and wrong in the other is worse than not having it at all.

[general]
working_directory = "None"
live_config_reload = true
# Wallpaper-driven colors (wallust). Missing file only warns; defaults apply.
import = ["~/.config/alacritty/generated-colors.toml"]

[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
dimensions = { columns = 100, lines = 30 }
dynamic_padding = true
decorations = "Full"
# Matches kitty — see the measured sweep in kitty/kitty.conf for why 0.85 is
# the lowest opacity that clears 4.5:1 body-text contrast on every wallpaper.
opacity = 0.85
padding = { x = 10, y = 8 }
title = "Alacritty@CachyOS"
class = { instance = "Alacritty", general = "Alacritty" }
decorations_theme_variant = "Dark"

[scrolling]
history = 10000
multiplier = 3

[font]
# Named explicitly, NOT the "monospace" generic: that resolves to Noto Sans
# Mono here, which has no Nerd Font glyphs, so tmux's statusline separators and
# icons render as tofu.
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 12.0

[colors]
draw_bold_text_with_bright_colors = true
# Palette comes from generated-colors.toml (wallust / Catppuccin fallback),
# imported at the top under [general].

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
# Beam and blinking, to match kitty. Colour and text colour come from the
# generated palette; unfocused_hollow keeps a hollow beam behind the focused
# one rather than a second solid block.
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true
thickness = 1.5

[mouse]
hide_when_typing = true
bindings = [
    { mouse = "Middle", mods = "None", action = "PasteSelection" },
]

[keyboard]
bindings = [
    { key = "Paste", mods = "None", action = "Paste" },
    { key = "Copy", mods = "None", action = "Copy" },
    { key = "L", mods = "Control", action = "ClearLogNotice" },
    { key = "L", mods = "Control", mode = "~Vi", chars = "\f" },
    { key = "PageUp", mods = "Shift", mode = "~Alt", action = "ScrollPageUp" },
    { key = "PageDown", mods = "Shift", mode = "~Alt", action = "ScrollPageDown" },
    { key = "Home", mods = "Shift", mode = "~Alt", action = "ScrollToTop" },
    { key = "End", mods = "Shift", mode = "~Alt", action = "ScrollToBottom" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "F", mods = "Control|Shift", action = "SearchForward" },
    { key = "B", mods = "Control|Shift", action = "SearchBackward" },
    { key = "C", mods = "Control|Shift", mode = "Vi", action = "ClearSelection" },
    { key = "Key0", mods = "Control", action = "ResetFontSize" },
]
