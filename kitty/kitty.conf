# kitty — https://sw.kovidgoyal.net/kitty/conf/
#
# Colours are generated by wallust from the wallpaper into
# generated-colors.conf, included at the bottom of this file. This file
# deliberately defines no colours of its own; the last definition wins, so
# everything here is geometry and behaviour, not palette.

# ── Appearance ──────────────────────────────────────────────────────────────
# Pinned, not "monospace": the generic family resolves to Noto Sans Mono on
# this machine, which has no Nerd Font glyphs — so the tmux statusline
# separators (U+F0344) and icons would render as tofu boxes in kitty. Same
# reason alacritty/alacritty.toml names this family explicitly.
font_family      JetBrainsMono Nerd Font
font_size        12.0
# JetBrains Mono ships programming ligatures on by default (calt), so there is
# no font_features line to add.
bold_font        auto
italic_font      auto
bold_italic_font auto

# ── Transparency ────────────────────────────────────────────────────────────
# 0.85 is measured, not taste. The terminal is translucent over a *blurred*
# wallpaper, so the real contrast is not the palette's foreground-vs-background
# pair that wallust guarantees — it is the foreground against the wallpaper
# showing through. Swept over 51 wallpapers, each with its own wallust palette,
# taking the brightest 1% of the blurred image as the worst case:
#
#   opacity   >=4.5:1   worst case
#     0.60      21/51      2.06   (linux-penguin.jpg)
#     0.70      36/51      3.18
#     0.80      49/51      4.34
#     0.85      51/51      5.29
#
# 0.85 is the lowest value that clears WCAG 4.5:1 for body text on every
# wallpaper tested. Anything more transparent is a deliberate legibility trade.
# Hyprland's decoration.blur brightness (0.8) is already accounted for.
background_opacity 0.75
# The compositor blurs the window (decoration.blur in hyprland.lua), so kitty
# must NOT blur again — two blurs in series is just a softer, costlier version
# of the same effect.
background_blur 0
# Off: kitty's default is to snap the background to fully opaque when the
# window loses focus, which on a blurred desktop is a visible jump every time
# you alt-tab. Keep the translucency constant instead.
dynamic_background_opacity no

# ── Padding ─────────────────────────────────────────────────────────────────
# There is no `dynamic_padding` in kitty (that is alacritty's) — kitty rejects
# the key with "Ignoring unknown config key" and silently drops it.
window_padding_width 10

# ── Cursor ──────────────────────────────────────────────────────────────────
# Option names changed in kitty 0.49 and the old ones are not kept as aliases,
# they are rejected outright. Verified against
# /usr/lib/kitty/kitty/options/definition.py, because the shipped man page is
# only a pointer to the online docs and `kitty --help` lists no options:
#     cursor_beam              -> cursor_shape beam
#     cursor_blink             -> cursor_blink_interval  (0 DISABLES blinking)
#     cursor_thickness         -> cursor_beam_thickness
#     cursor_unfocused_opacity -> cursor_shape_unfocused hollow
# Colour and text colour still come from generated-colors.conf.
#
# Note kitty's shell integration already forces `beam` at prompts, overriding
# cursor_shape there; setting it explicitly just makes the rest of the session
# (vim, htop, a bare program) match instead of falling back to `block`.
cursor_shape           beam
cursor_shape_unfocused hollow
cursor_beam_thickness  2
cursor_blink_interval  0.5

# ── Shell behaviour ─────────────────────────────────────────────────────────
# Select-to-copy, matching alacritty's save_to_clipboard. Middle-click pastes.
copy_on_select clipboard
# The shell rarely needs a confirmation dialog before the last window closes.
confirm_os_window_close 0
# xterm-kitty is unknown to most remote servers; fall back to a universal TERM
term xterm-256color

# Wallpaper-driven colors (wallust). Missing file is fine — kitty just warns.
include generated-colors.conf
