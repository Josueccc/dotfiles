# tmux — https://man7.org/linux/man-pages/man1/tmux.1.html
#
# Colours come from the wallpaper: ~/.config/tmux/generated-colors.conf is
# written by wallust (see wallust/wallust.toml) and re-sourced on every
# wallpaper change. The static Catppuccin values below are the fallback for a
# machine that has never picked a wallpaper — last definition wins, so the
# generated file must be sourced AFTER this block.
#
# Everything colour-bearing below refers to palette names ("colour4"), which is
# fine for a fallback but would NOT follow the wallpaper in a running server:
# tmux fixes the palette at server start and rejects `set -g colour4` at runtime
# ("invalid option"). That is why the generated file restates the same options
# with literal hex — those do re-source live. Don't "simplify" them back to
# names here or the wallpaper stops reaching a running tmux.

# Change prefix to Ctrl+a (easier to reach)
unbind C-a
set -g prefix C-b
bind C-b send-prefix

# Enable mouse support
set -g mouse on

# Start window numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# Better split keys
bind | split-window -h
bind - split-window -v

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── General ──────────────────────────────────────────────────────────────────
# escape-time 0: a long one eats the leading key of a fast chord, which is the
# classic "my ctrl-c needs a second press inside tmux" bug. It also stops
# sending half a sequence while a slow-starting program (nvim, lazygit) sets up
# its tty.
set -g escape-time 0
set -g repeat-time 600
set -g focus-events on
set -g set-clipboard on
set -g renumber-windows on
set -g history-limit 50000
# No clock here: see the status-line section.
set -g status-interval 5

# ── Panes ───────────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=colour8"
set -g pane-active-border-style "fg=colour4"
# Pane number on the active pane only. These take a palette INDEX, not a
# colour, so they keep the server's startup palette until tmux restarts —
# harmless, because index 1 is a dim surface in every wallpaper palette.
set -g display-panes-colour       1
set -g display-panes-active-colour 2

# ── Static fallback palette (Catppuccin Mocha) ──────────────────────────────
# Replaced by the wallust-generated file sourced at the bottom.
# One option per line: tmux's set takes at most one name/value pair, and a
# second pair on the same line raises "too many arguments (need at most 2)"
# and aborts the remainder of the config file.
set -g default-terminal "tmux-256color"
set -g default-colour  "#cdd6f4"
set -g colour0  "#45475a"
set -g colour1  "#f38ba8"
set -g colour2  "#a6e3a1"
set -g colour3  "#f9e2af"
set -g colour4  "#89b4fa"
set -g colour5  "#cba6f7"
set -g colour6  "#94e2d5"
set -g colour7  "#bac2de"
set -g colour8  "#585b70"
set -g colour9  "#f38ba8"
set -g colour10 "#a6e3a1"
set -g colour11 "#f9e2af"
set -g colour12 "#89b4fa"
set -g colour13 "#cba6f7"
set -g colour14 "#94e2d5"
set -g colour15 "#a6adc8"

# ── Status line ─────────────────────────────────────────────────────────────
# Status bar at top. The glyphs are Nerd Font private-use codepoints (U+F0xx /
# U+F01xx) and need a font that actually has them — both kitty and alacritty
# are pinned to JetBrainsMono Nerd Font for exactly this reason. Anything else
# (tmux-sensible, a stock terminal font) renders them as tofu boxes.
#
# There is deliberately NO clock. waybar already owns one (modules-center), and
# tmux does not strftime-expand status lines at all — %H:%M renders literally
# (verified on tmux 3.7c) — so a tmux clock has to be `#(date +...)`, which
# forks a shell on every status-interval tick. Two clocks on one screen is worse
# than the saving.
set -g status-position top
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 60
set -g status-style "fg=colour7,bg=colour0"

# ── Status line ─────────────────────────────────────────────────────────────
# The glyphs below are Nerd Font private-use codepoints and need a font that
# actually has them — both kitty and alacritty are pinned to JetBrainsMono Nerd
# Font for exactly this reason. Anything else (tmux-sensible, a stock terminal
# font) renders them as tofu boxes. The codepoints are:
#   U+F0120 terminal (>_) · U+F065E maximise · U+F002 magnifier · U+F0F3 bell
#   U+F015A circle-x · U+F023 padlock · U+F108 computer · U+2502 bar · U+25CF dot
#
# They are NOT powerline separators, on purpose. The Nerd Font powerline
# glyphs (U+F0404, U+F0344) are thin half-cell connectors meant to abut the
# next cell; a monospace font gives every glyph the same advance width, so they
# render as a crossed-out scribble floating in dead space. A plain bar has no
# such constraint and cannot overlap anything.
#
# There is deliberately NO clock. waybar already owns one (modules-center), and
# tmux does not strftime-expand status lines at all — %H:%M renders literally
# (verified on tmux 3.7c) — so a tmux clock has to be `#(date +...)`, which
# forks a shell on every status-interval tick. Two clocks on one screen is
# worse than the saving.
set -g status-position top
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 60

# Left: a terminal glyph and the session name, both in the accent. #[default]
# resets to status-style so the window list is not painted in the accent too.
set -g status-left "#[fg=colour4] 󰄠 #[fg=colour4,bold]#S#[default] "

# Window list: plain bar between windows, filled pill for the active one.
# `#F` is deliberately absent — it is what emitted the glued `-` and `*` marks
# right after the window name. The activity and bell markers are explicit
# conditionals instead, so each gets its own colour and its own space.
set -g window-status-separator "#[fg=colour8]│#[default]"
setw -g window-status-format " #[fg=colour7]#I:#W#{?window_activity_flag,#[fg=colour4] ●,}#{?window_bell_flag,#[fg=colour1] ,}#[default] "
setw -g window-status-current-format " #[bg=colour4]#[fg=colour0] #I:#W #[default]"

# Right: state indicators, then the host. Each conditional collapses to nothing
# when its flag is unset, so a healthy session is just the hostname.
set -g status-right "#{?window_zoomed_flag,#[fg=colour1] 󰙞 ,}\
#{?pane_in_mode,#[fg=colour2]  ,}\
#{?window_bell_flag,#[fg=colour1]  ,}\
#{?pane_dead,#[fg=colour1] 󰅚 ,}\
#{?client_prefix,#[fg=colour4]  ,}\
#[fg=colour8] #H"

set -g window-status-activity-style "fg=colour4,bold"
set -g window-status-bell-style     "fg=colour1,bold"

# Messages, mode and copy-mode use the accent too, so a tmux prompt reads as
# part of the desktop rather than as a green default bar.
set -g message-style         "fg=colour0,bg=colour1,bold"
set -g message-command-style "fg=colour0,bg=colour4,bold"
set -g mode-style            "fg=colour0,bg=colour2,bold"
set -g mode-keys-style       "fg=colour4,bg=colour0"
set -g copy-mode-style       "fg=colour0,bg=colour4,bold"

### plugin section ###
# List of plugins
#
# tmux-tokyo-night was removed on purpose: it hardcodes its own colours, which
# would win over the wallpaper palette. The status line is hand-rolled above
# instead. It is still on disk in ~/.tmux/plugins — remove it with
# `tpm uninstall adonespitogo/tmux-tokyo-night` if you want the directory gone.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@gitlab.com:user/plugin'
# set -g @plugin 'bitbucket.org:user/plugin'

# ── Wallpaper palette (wallust) ─────────────────────────────────────────────
# MUST come after the static palette above — tmux takes the last value, so these
# are what actually win. -q keeps a missing file silent, which is the normal
# state on a fresh install until the first wallpaper is picked.
#
# Order matters: generated-colors.conf first (it sets the palette the static
# colour names above resolve against), then generated-styles.conf (which
# overrides the same options with literal hex). On a wallpaper change,
# apply-theme.sh re-sources ONLY the styles file — the palette cannot be
# changed in a running server.
source-file -q "$HOME/.config/tmux/generated-colors.conf"
source-file -q "$HOME/.config/tmux/generated-styles.conf"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
